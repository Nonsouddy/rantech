<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagon Background -->
  <polygon points="200,20 360,110 360,290 200,380 40,290 40,110" fill="#0A0A0A" stroke="#2563EB" stroke-width="20"/>
  
  <!-- Transformer Outline -->
  <g stroke="#FFD700" stroke-width="3" fill="none">
    <!-- Main body -->
    <rect x="120" y="140" width="160" height="80" rx="5"/>
    <!-- Windings -->
    <rect x="130" y="145" width="20" height="70"/>
    <rect x="160" y="145" width="20" height="70"/>
    <rect x="190" y="145" width="20" height="70"/>
    <rect x="220" y="145" width="20" height="70"/>
    <!-- Bushings on top -->
    <rect x="135" y="120" width="8" height="20"/>
    <rect x="165" y="120" width="8" height="20"/>
    <rect x="195" y="120" width="8" height="20"/>
    <rect x="225" y="120" width="8" height="20"/>
    <!-- Feet -->
    <rect x="125" y="220" width="20" height="10" rx="2"/>
    <rect x="255" y="220" width="20" height="10" rx="2"/>
  </g>
  
  <!-- Lightning Circle -->
  <circle cx="200" cy="180" r="22" fill="none" stroke="#FFD700" stroke-width="3"/>
  <path d="M200 165 L190 185 L205 185 L195 195" fill="#FFD700" stroke="none"/>
  
  <!-- REPC Text -->
  <text x="200" y="320" font-family="Arial Black, sans-serif" font-size="70" font-weight="900" fill="white" text-anchor="middle" letter-spacing="5">REPC</text>
</svg>